[package]
name = "super-command"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["termion", "all-widgets", "layout-cache", "macros"] }
termion = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
shlex = "1.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
